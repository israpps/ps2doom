name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:v1.0
    steps:

      - name: Dependencies
        run: |
          apk add make git zip

      - uses: actions/checkout@v4
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow

      - name: Compile DOOM
        run: |
          rm -rf bin/
          mkdir -p bin/
          make release -C src

      - name: Install custom PS2 SDL for arcade
        run: |
          git clone --branch "v1.0-arcade" "https://github.com/israpps/ps2sdk-ports"
          make sdl -C ps2sdk-ports

      - name: Compile ARCADE DOOM
        run: |
          rm -rf System246/
          mkdir -p System246/
          cp data/boot.bin System246/
          make release -C src BINDIR=../System246/ ARCADE=1

      - name: Upload artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: PS2DOOM
          path: |
            bin/*

      - name: pack
        run: |
          zip PS2DOOM.zip -9 -r bin/ ./COPYING ./README.MD
          zip PS2DOOM-ARCADE.zip -9 -r System246/ ./COPYING ./README.MD

      - uses: "mathieucarbou/marvinpinto-action-automatic-releases@latest"
        if: github.ref == 'refs/heads/master'
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "nightly"
          prerelease: true
          title: "Nightly build"
          files: |
            PS2DOOM.zip
            PS2DOOM-ARCADE.zip

      - uses: "mathieucarbou/marvinpinto-action-automatic-releases@latest"
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          draft: true
          files: |
            PS2DOOM.zip
            PS2DOOM-ARCADE.zip